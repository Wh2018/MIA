### model
# Path to the base model. Override on the command line if your local copy
# lives somewhere else, e.g.:
#   llamafactory-cli train training/qwen25_lora_sft.yaml \
#       model_name_or_path=/path/to/base-model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
# As actually trained for the MIA paper. The paper text says LoRA r=8 on the
# attention layers with dropout 0.1, but the released configs use `all` and
# 0.0 — we keep the actual-training values here.
lora_target: all
lora_rank: 8
lora_dropout: 0.0

### dataset
# Two datasets are supported out of the box: CPsy_train (CPsyCounD) and
# ESC_train (ESConv). Pick one or override on the command line.
dataset: CPsy_train
template: qwen
cutoff_len: 40960
max_samples: 40000
overwrite_cache: true
preprocessing_num_workers: 16

### output
# Override on CLI when running for a specific dataset/variant, e.g.
#   output_dir=data/training/CPsy/full
output_dir: data/training/sft_output
logging_steps: 10
save_steps: 1500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
